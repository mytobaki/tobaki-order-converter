<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토박이마을 단체주문 양식 변환기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; color: #333; background: #f5f5f5; }
        .container { padding: 2rem; max-width: 1000px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { margin-bottom: 2rem; }
        h1 { font-size: 28px; margin-bottom: 0.5rem; }
        .subtitle { color: #666; font-size: 14px; }
        .section { margin-bottom: 2rem; }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 1rem; color: #222; }
        .tabs { display: flex; gap: 1rem; margin-bottom: 1rem; border-bottom: 1px solid #ddd; }
        .tab { padding: 12px 16px; background: none; border: none; cursor: pointer; font-size: 14px; color: #666; border-bottom: 2px solid transparent; }
        .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .upload-area { border: 2px dashed #ddd; border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; background: #fafafa; }
        .upload-area:hover { border-color: #1a73e8; background: #f0f7ff; }
        input[type="file"] { display: none; }
        textarea { width: 100%; height: 200px; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; font-family: monospace; font-size: 13px; }
        .button { background: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .button:hover { background: #1765cc; }
        .button-secondary { background: white; color: #1a73e8; border: 1px solid #1a73e8; }
        .button-secondary:hover { background: #f0f7ff; }
        .button-success { background: #0f9d58; }
        .button-success:hover { background: #0d8c4a; }
        .status { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 14px; display: none; }
        .status.show { display: block; }
        .status.success { background: #e6f4ea; color: #0d652d; border-left: 4px solid #0f9d58; }
        .status.error { background: #fce8e6; color: #740001; border-left: 4px solid #d33b27; }
        .status.info { background: #e8f0fe; color: #1a3a52; border-left: 4px solid #1a73e8; }
        .preview { border: 1px solid #ddd; border-radius: 8px; overflow-x: auto; margin-top: 1rem; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f0f0f0; padding: 12px; text-align: left; font-weight: 600; border-bottom: 1px solid #ddd; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; }
        td input { width: 100%; border: none; padding: 4px; background: transparent; font-family: inherit; }
        td input:focus { outline: 1px solid #1a73e8; padding: 3px; }
        .button-group { display: flex; gap: 12px; margin-top: 1.5rem; }
        .file-info { font-size: 13px; color: #666; margin-top: 0.5rem; }
        .loading { display: none; text-align: center; padding: 2rem; }
        .spinner { border: 3px solid #e0e0e0; border-top: 3px solid #1a73e8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍲 토박이마을 단체주문 양식 변환기</h1>
            <p class="subtitle">파일 또는 텍스트로 주문 데이터를 입력하고, 표준 양식으로 정렬하세요</p>
        </div>

        <div class="section">
            <h2 class="section-title">1단계: 데이터 입력</h2>
            
            <div class="tabs">
                <button class="tab active" onclick="switchTab('file')">📁 파일 업로드</button>
                <button class="tab" onclick="switchTab('text')">📝 텍스트 입력</button>
            </div>

            <div id="fileTab" class="tab-content
