<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토박이마을 단체주문 양식 변환기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.4.1/papaparse.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); color: var(--text-primary); }
        .container { padding: 2rem; max-width: 900px; }
        .section { margin-bottom: 2rem; }
        .section-title { font-size: 18px; font-weight: 500; margin-bottom: 1rem; color: var(--text-primary); }
        .upload-area { border: 2px dashed var(--border-strong); border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; background: var(--surface-1); transition: all 0.2s; }
        .upload-area:hover { border-color: var(--text-accent); background: var(--bg-accent-muted); }
        .upload-area.active { border-color: var(--text-accent); background: var(--bg-accent); }
        input[type="file"] { display: none; }
        .button { background: var(--fill-accent); color: var(--on-accent); border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background 0.2s; }
        .button:hover { background: #1a73e8; }
        .button:disabled { opacity: 0.5; cursor: not-allowed; }
        .button-secondary { background: transparent; color: var(--text-accent); border: 0.5px solid var(--border-strong); }
        .button-secondary:hover { background: var(--surface-1); }
        .status { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 14px; }
        .status.success { background: var(--bg-success); color: var(--text-success); }
        .status.error { background: var(--bg-danger); color: var(--text-danger); }
        .status.info { background: var(--bg-accent); color: var(--on-accent); }
        .preview { border: 0.5px solid var(--border); border-radius: 12px; overflow: auto; margin-top: 1rem; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: var(--surface-1); padding: 12px 8px; text-align: left; font-weight: 500; border-bottom: 0.5px solid var(--border); white-space: nowrap; }
        td { padding: 8px; border-bottom: 0.5px solid var(--border); }
        td input { width: 100%; border: none; padding: 0; background: transparent; color: var(--text-primary); font-family: inherit; }
        td input:focus { outline: none; }
        .file-info { font-size: 13px; color: var(--text-secondary); margin-top: 0.5rem; }
        .loading { display: none; text-align: center; padding: 2rem; }
        .spinner { border: 3px solid var(--border); border-top: 3px solid var(--text-accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 24px; margin-bottom: 2rem;">토박이마을 단체주문 양식 변환기</h1>

        <div class="section">
            <h2 class="section-title">1단계: 데이터 입력</h2>
            
            <div style="display: flex; gap: 1rem; margin-bottom: 1rem; border-bottom: 0.5px solid var(--border);">
                <button class="tab-button active" onclick="switchTab('file')" style="padding: 0.75rem 1rem; background: none; border: none; border-bottom: 2px solid var(--text-accent); cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-primary);">📁 파일 업로드</button>
                <button class="tab-button" onclick="switchTab('text')" style="padding: 0.75rem 1rem; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-secondary);">📝 텍스트 붙여넣기</button>
            </div>

            <div id="fileTab">
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click();">
                    <p style="margin-bottom: 0.5rem;">📁 파일을 여기에 드래그하거나 클릭하세요</p>
                    <p style="font-size: 13px; color: var(--text-secondary);">지원 형식: 엑셀(.xlsx, .xls), 한글(.hwp, .hwpx), 워드(.docx), 텍스트(.txt), 이미지(.jpg, .png)</p>
                    <input type="file" id="fileInput" accept=".xlsx,.xls,.hwp,.hwpx,.docx,.txt,.jpg,.jpeg,.png,.gif,.pdf">
                </div>
                <div class="file-info" id="fileInfo"></div>
            </div>

            <div id="textTab" style="display: none;">
                <textarea id="pasteArea" placeholder="카톡, 문자, 메일로 받은 주문 데이터를 여기에 붙여넣기하세요" style="width: 100%; height: 200px; padding: 1rem; border: 0.5px solid var(--border); border-radius: 8px; font-family: monospace; font-size: 13px; resize: vertical;"></textarea>
                <button class="button" onclick="processPastedText()" style="width: 100%; padding: 1rem; margin-top: 1rem;">✓ 붙여넣은 데이터 처리</button>
            </div>
        </div>

        <div class="section">
            <div id="status" style="display: none;"></div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 1rem; color: var(--text-secondary);">AI가 데이터를 처리 중입니다...</p>
            </div>
        </div>

        <div class="section" id="previewSection" style="display: none;">
            <h2 class="section-title">2단계: 미리보기 및 편집</h2>
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 1rem;">아래 표의 내용을 확인하고 필요하면 수정하세요</p>
            <div class="preview" id="preview"></div>
        </div>

        <div class="section" id="downloadSection" style="display: none;">
            <button class="button" onclick="downloadExcel()" style="width: 100%; padding: 1rem;">📥 표준 양식으로 다운로드</button>
            <button class="button-secondary button" onclick="location.reload()" style="width: 100%; padding: 1rem; margin-top: 0.5rem;">새로 시작</button>
        </div>
    </div>

    <script>
        const COLUMNS = ['No', '주문번호', '이름', '우편번호', '주소', '전화번호', '휴대폰번호', '주문내용', '수량', '배송메시지', '보내는사람 이름', '보내는사람 주소', '보내는사람 전화번호'];
        let currentData = [];

        function switchTab(tab) {
            document.getElementById('fileTab').style.display = tab === 'file' ? 'block' : 'none';
            document.getElementById('textTab').style.display = tab === 'text' ? 'block' : 'none';
            
            document.querySelectorAll('.tab-button').forEach((btn, idx) => {
                if ((tab === 'file' && idx === 0) || (tab === 'text' && idx === 1)) {
                    btn.style.borderBottomColor = 'var(--text-accent)';
                    btn.style.color = 'var(--text-primary)';
                } else {
                    btn.style.borderBottomColor = 'transparent';
                    btn.style.color = 'var(--text-secondary)';
                }
            });
        }

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('active');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('active');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('active');
            const files = e.dataTransfer.files;
            if (files.length) {
                fileInput.files = files;
                handleFileSelect();
            }
        });

        fileInput.addEventListener('change', handleFileSelect);

        async function handleFileSelect() {
            const file = fileInput.files[0];
            if (!file) return;

            document.getElementById('fileInfo').textContent = `선택된 파일: ${file.name}`;
            showStatus('파일을 처리 중입니다...', 'info');
            document.getElementById('loading').style.display = 'block';

            try {
                const fileContent = await readFile(file);
                await processWithAPI(fileContent);
            } catch (error) {
                showStatus(`오류: ${error.message}`, 'error');
                document.getElementById('loading').style.display = 'none';
            }
        }

        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const fileName = file.name.toLowerCase();
                    
                    if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
                        try {
                            const workbook = XLSX.read(e.target.result, { type: 'array' });
                            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                            const csv = XLSX.utils.sheet_to_csv(firstSheet);
                            resolve(csv);
                        } catch (err) {
                            reject(new Error('엑셀 파일을 읽을 수 없습니다'));
                        }
                    } else if (fileName.endsWith('.hwp') || fileName.endsWith('.hwpx')) {
                        resolve(`[한글 파일]\n내용을 텍스트로 복사하여 다시 업로드하거나, 아래 표에 직접 입력해주세요`);
                    } else if (fileName.endsWith('.docx') || file.type.includes('word')) {
                        resolve(`[워드 파일]\n내용을 텍스트로 복사하여 다시 업로드하거나, 아래 표에 직접 입력해주세요`);
                    } else if (file.type.includes('text')) {
                        resolve(e.target.result);
                    } else if (file.type.includes('image')) {
                        resolve(`[이미지 파일]\n스캔 이미지인 경우 텍스트로 복사해서 붙여넣기로 입력해주세요`);
                    } else {
                        resolve(e.target.result);
                    }
                };
                reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다'));

                if (file.name.toLowerCase().endsWith('.xlsx') || file.name.toLowerCase().endsWith('.xls')) {
                    reader.readAsArrayBuffer(file);
                } else if (file.type.includes('image')) {
                    reader.readAsDataURL(file);
                } else {
                    reader.readAsText(file, 'utf-8');
                }
            });
        }

        function processPastedText() {
            const text = document.getElementById('pasteArea').value.trim();
            if (!text) {
                showStatus('텍스트를 입력해주세요', 'error');
                return;
            }

            showStatus('데이터를 처리 중입니다...', 'info');
            document.getElementById('loading').style.display = 'block';

            setTimeout(() => {
                processWithAPI(text);
            }, 500);
        }

        async function processWithAPI(fileContent) {
            try {
                console.log('API 요청 시작...');
                
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileContent })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || response.statusText);
                }

                const data = await response.json();
                
                if (!data.success || !data.data) {
                    throw new Error('데이터 처리에 실패했습니다');
                }

                currentData = data.data.map((row, idx) => ({
                    'No': row['No'] || (idx + 1).toString(),
                    ...row
                }));

                showPreview();
                showStatus('✓ 데이터 처리 완료! 필요하면 수정 후 다운로드하세요', 'success');
                
            } catch (error) {
                console.error('상세 오류:', error);
                showStatus(`처리 오류: ${error.message}`, 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function showPreview() {
            if (currentData.length === 0) {
                showStatus('데이터가 없습니다', 'error');
                return;
            }

            let html = '<table><thead><tr>';
            COLUMNS.forEach(col => {
                html += `<th>${col}</th>`;
            });
            html += '</tr></thead><tbody>';

            currentData.forEach((row, rowIdx) => {
                html += '<tr>';
                COLUMNS.forEach(col => {
                    const value = row[col] || '';
                    html += `<td><input type="text" value="${escapeHtml(value)}" data-row="${rowIdx}" data-col="${col}"></td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            document.getElementById('preview').innerHTML = html;

            document.querySelectorAll('input[type="text"]').forEach(input => {
                input.addEventListener('change', (e) => {
                    const rowIdx = parseInt(e.target.dataset.row);
                    const col = e.target.dataset.col;
                    currentData[rowIdx][col] = e.target.value;
                });
            });

            document.getElementById('previewSection').style.display = 'block';
            document.getElementById('downloadSection').style.display = 'block';
        }

        function downloadExcel() {
            const ws = XLSX.utils.json_to_sheet(currentData, { header: COLUMNS });
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '단체주문');
            XLSX.writeFile(wb, `토박이마을_단체주문_${new Date().toISOString().slice(0, 10)}.xlsx`);
            showStatus('✓ 엑셀 파일이 다운로드되었습니다', 'success');
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.className = `status ${type}`;
            statusEl.textContent = message;
            statusEl.style.display = 'block';
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
